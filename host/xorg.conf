# A virtual 1080p60 monitor on the NVIDIA GPU of a headless host, for Sunshine to capture.
Section "ServerLayout"
    Identifier "ps-river"
    Screen     "virtual"
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "nvidia"
    Driver     "nvidia"
    BusID      "PCI:1:0:0"
    Option     "AllowEmptyInitialConfiguration" "true"
    Option     "ConnectedMonitor" "DFP-0"
    Option     "ModeValidation" "AllowNonEdidModes, NoEdidMaxPClkCheck, NoMaxPClkCheck, NoHorizSyncCheck, NoVertRefreshCheck"
EndSection

Section "Monitor"
    Identifier  "virtual"
    HorizSync   5.0 - 1000.0
    VertRefresh 5.0 - 200.0
    Modeline    "1920x1080_60" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
EndSection

Section "Screen"
    Identifier   "virtual"
    Device       "nvidia"
    Monitor      "virtual"
    DefaultDepth 24
    Option       "MetaModes" "DFP-0: 1920x1080_60 +0+0"
    SubSection "Display"
        Depth 24
        Modes "1920x1080_60"
    EndSubSection
EndSection
